services:
  #api
  api:
    container_name: api
    image: api
    ports:
      - "4000:4000"
    command: ["sh", "-c", "npm run migrate:prod && npm start"]
    networks:
      - apinet
    depends_on:
      db:
        condition: service_healthy

  #db
  db:
    container_name: db
    platform: linux/x86_64
    image: mysql:8
    ports:
      - "3306:3306"
    volumes:
      - apidata:/var/lib/mysql
    restart: always # always restart unless stopped manually
    env_file:
      - .env.mysql
    networks:
      - apinet
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent',
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  #phpadmin
  admin:
    container_name: admin
    image: phpmyadmin/phpmyadmin
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_ARBITRARY: 1
    ports:
      - "4088:80"
    networks:
      - apinet

volumes:
  apidata:
    driver: local
    name: apidata

networks:
  apinet:
    name: apinet
